plugins:
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 3.4
  NewCops: enable
  Exclude:
    - "vendor/**/*"
    - "output/**/*"

inherit_from: .rubocop_todo.yml

# This project renders pixel-precise card layouts, so it carries a large number
# of intentional numeric layout constants. Documenting every one is noise.
Style/Documentation:
  Enabled: false

# Layout constants and vips coordinates are inherently "magic"; we centralise
# them in lib/layout.rb rather than annotating each literal.
Style/NumericLiterals:
  Enabled: false

# Keep string literals relaxed; the codebase mixes them and frozen-string
# pragmas are added per file.
Style/FrozenStringLiteralComment:
  Enabled: false

# The codebase consistently uses double-quoted strings (matching QuotedSymbols).
Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

# x/y are the conventional names for pixel coordinates throughout the renderers.
Naming/MethodParameterName:
  AllowedNames:
    - x
    - y

# Comparable#clamp raises when min > max; the explicit [[v, lo].max, hi].min
# form used for symbol placement degrades gracefully instead, so keep it.
Style/ComparableClamp:
  Enabled: false
